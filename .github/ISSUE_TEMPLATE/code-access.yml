name: Запрос материалов и кода
description: Запросить ручную подготовку очищенного пакета AAFvsLLM
title: "[Доступ к коду] "
body:
  - type: markdown
    attributes:
      value: |
        Запрос рассматривается владельцем вручную и не гарантирует доступ.
        Не указывайте здесь персональные данные, пароли, токены или другую конфиденциальную информацию.
  - type: input
    id: github_username
    attributes:
      label: GitHub username
      description: Аккаунт, для которого запрашивается доступ
      placeholder: username
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Цель доступа
      description: Кратко опишите исследовательскую или инженерную задачу
    validations:
      required: true
  - type: checkboxes
    id: components
    attributes:
      label: Запрашиваемые пакеты
      description: Отметьте только действительно необходимые материалы
      options:
        - label: Очищенный AAF Core — архитектурная реализация без сервера и Turbo-памяти
        - label: Retained V3 — пакет и выбранные воспроизводящие материалы
        - label: Conflict witnesses — обезличенные raw cases и verifier
        - label: Plasticity witness — выбранные cases, checkpoint-метрики и harness
        - label: Synthesis dataset — AST, candidate space и falsification-материалы
  - type: textarea
    id: custom_scope
    attributes:
      label: Точный объём
      description: Укажите минимальный необходимый набор и причину
    validations:
      required: true
  - type: textarea
    id: intended_use
    attributes:
      label: Предполагаемое использование
      description: Как будет использован результат просмотра
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Подтверждения
      options:
        - label: Я понимаю, что проект закрыт, не готов к production и доступ не гарантирован.
          required: true
        - label: Я не публиковал в запросе конфиденциальные данные.
          required: true
